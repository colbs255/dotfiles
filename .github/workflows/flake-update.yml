name: flake update

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Update flake inputs
        run: nix develop -c just update
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          name: flake-lock
          path: flake.lock

  # Lint + flake check against the updated lock (tool versions come from nixpkgs).
  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flake-lock
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Flake check
        run: nix flake check
      - name: Nix format
        run: nix fmt -- --ci
      - name: Lint
        run: nix develop -c just lint

  build-system:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      # The full system closure doesn't fit in the runner's default free space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flake-lock
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Build NixOS system
        run: nix develop -c just check-system

  build-home-linux:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flake-lock
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Build home (nixos)
        run: nix develop -c just check-home nixos

  pr:
    needs: [check, build-system, build-home-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flake-lock
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: flake-update
          delete-branch: true
          commit-message: Flake update
          title: Flake update
          body: |
            Automated `nix flake update`.

            Validated in CI: flake check, format, lint, NixOS system build, and home build for `colby@nixos`.
