onboarding = false

[theme]
name = "tokyo-night"

[terminal]
default_shell = "fish"

[update]
version_check = false

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+space"
next_agent = "prefix+n"
previous_agent = "prefix+p"
next_tab = "prefix+."
previous_tab = "prefix+,"
goto = "prefix+s"
settings = ""

[worktrees]
directory = "~/.local/share/herdr/worktrees"

[experimental]
pane_history = false

[advanced]
scrollback_limit_bytes = 10000000
